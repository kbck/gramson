$schema: https://json-schema.org/draft/2020-12/schema
title: comparison operators
$defs:
  equal:
    title: Equality
    type: object
    required:
    - ==
    additionalProperties: false
    properties:
      ==:
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 2
    description: 'Compare two expressions using the coercing equality form.


      Coercion behavior remains an open runtime decision; validation accepts the expression
      structure only.'
  strictEqual:
    title: Strict equality
    type: object
    required:
    - ===
    additionalProperties: false
    properties:
      ===:
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 2
    description: Compare two expressions using the strict equality form.
  notEqual:
    title: Inequality
    type: object
    required:
    - '!='
    additionalProperties: false
    properties:
      '!=':
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 2
    description: 'Compare two expressions using the coercing inequality form.


      Coercion behavior remains an open runtime decision; validation accepts the expression
      structure only.'
  strictNotEqual:
    title: Strict inequality
    type: object
    required:
    - '!=='
    additionalProperties: false
    properties:
      '!==':
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 2
    description: Compare two expressions using the strict inequality form.
  greaterThan:
    title: Greater than
    type: object
    required:
    - '>'
    additionalProperties: false
    properties:
      '>':
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 2
    description: Compare whether the first value exceeds the second.
  greaterThanOrEqual:
    title: Greater than or equal
    type: object
    required:
    - '>='
    additionalProperties: false
    properties:
      '>=':
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 2
    description: Compare whether the first value is at least the second.
  lessThan:
    title: Less than
    type: object
    required:
    - <
    additionalProperties: false
    properties:
      <:
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 3
    description: 'Compare values in increasing order.


      Accepts two expressions for comparison or three expressions for an exclusive
      range.'
  lessThanOrEqual:
    title: Less than or equal
    type: object
    required:
    - <=
    additionalProperties: false
    properties:
      <=:
        type: array
        items:
          $ref: ../expression.schema.yaml#/$defs/expression
        minItems: 2
        maxItems: 3
    description: 'Compare values in nondecreasing order.


      Accepts two expressions for comparison or three expressions for an inclusive
      range.'
