$schema: https://json-schema.org/draft/2020-12/schema
title: logic operators
$defs:
  conditional:
    title: Conditional
    type: object
    required:
    - if
    additionalProperties: false
    properties:
      if:
        oneOf:
        - $ref: ../expression.schema.yaml#/$defs/expression
          not:
            type: array
        - type: array
          items:
            $ref: ../expression.schema.yaml#/$defs/expression
          minItems: 0
    description: 'Choose a result using condition/result pairs.


      Accepts condition/result pairs with an optional final fallback. JSON Logic returns
      null for no arguments and evaluates a sole argument as the fallback. Non-array
      shorthand supplies a single fallback expression. If no condition matches and
      no fallback is supplied, the agreed result is null; evaluation is not implemented.'
  conditionalAlias:
    title: Conditional alias
    type: object
    required:
    - '?:'
    additionalProperties: false
    properties:
      '?:':
        oneOf:
        - $ref: ../expression.schema.yaml#/$defs/expression
          not:
            type: array
        - type: array
          items:
            $ref: ../expression.schema.yaml#/$defs/expression
          minItems: 0
    description: 'Use the JSON Logic ?: alias for if.


      Uses the same syntax rules as if, including no arguments, a single fallback
      expression, and non-array shorthand; evaluation is not implemented.'
  logicalAnd:
    title: Logical AND
    type: object
    required:
    - and
    additionalProperties: false
    properties:
      and:
        oneOf:
        - $ref: ../expression.schema.yaml#/$defs/expression
          not:
            type: array
        - type: array
          items:
            $ref: ../expression.schema.yaml#/$defs/expression
          minItems: 1
    description: 'Combine expressions using the JSON Logic AND form.


      The intended JSON Logic behavior short-circuits and returns an operand value.
      Truthiness and evaluation rules are not implemented.'
  logicalOr:
    title: Logical OR
    type: object
    required:
    - or
    additionalProperties: false
    properties:
      or:
        oneOf:
        - $ref: ../expression.schema.yaml#/$defs/expression
          not:
            type: array
        - type: array
          items:
            $ref: ../expression.schema.yaml#/$defs/expression
          minItems: 1
    description: 'Combine expressions using the JSON Logic OR form.


      The intended JSON Logic behavior short-circuits and returns an operand value.
      Truthiness and evaluation rules are not implemented.'
  logicalNot:
    title: Logical NOT
    type: object
    required:
    - '!'
    additionalProperties: false
    properties:
      '!':
        oneOf:
        - $ref: ../expression.schema.yaml#/$defs/expression
          not:
            type: array
        - type: array
          items:
            $ref: ../expression.schema.yaml#/$defs/expression
          minItems: 1
          maxItems: 1
    description: Negate the truthiness of one expression.
  booleanCast:
    title: Boolean conversion
    type: object
    required:
    - '!!'
    additionalProperties: false
    properties:
      '!!':
        oneOf:
        - $ref: ../expression.schema.yaml#/$defs/expression
          not:
            type: array
        - type: array
          items:
            $ref: ../expression.schema.yaml#/$defs/expression
          minItems: 1
          maxItems: 1
    description: 'Use the JSON Logic Boolean conversion form.


      One expression is accepted. The syntax does not settle the DSL''s conversion
      or truthiness policy.'
