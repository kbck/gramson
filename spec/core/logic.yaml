if:
  title: Conditional
  summary: Choose a result using condition/result pairs.
  description: Accepts condition/result pairs with an optional final fallback.
    JSON Logic returns null for no arguments and evaluates a sole argument as
    the fallback. Non-array shorthand supplies a single fallback expression.
    If no condition matches and no fallback is supplied, the agreed result is null;
    evaluation is not implemented.
  schemaName: conditional
  argumentKind: expression
  minArgs: 0
  shorthand: true
'?:':
  title: Conditional alias
  summary: 'Use the JSON Logic ?: alias for if.'
  description: Uses the same syntax rules as if, including no arguments,
    a single fallback expression, and non-array shorthand;
    evaluation is not implemented.
  schemaName: conditionalAlias
  argumentKind: expression
  minArgs: 0
  shorthand: true
and:
  title: Logical AND
  summary: Combine expressions using the JSON Logic AND form.
  description: The intended JSON Logic behavior short-circuits and returns an operand
    value. Truthiness and evaluation rules are not implemented.
  schemaName: logicalAnd
  argumentKind: expression
  minArgs: 1
  shorthand: true
or:
  title: Logical OR
  summary: Combine expressions using the JSON Logic OR form.
  description: The intended JSON Logic behavior short-circuits and returns an operand
    value. Truthiness and evaluation rules are not implemented.
  schemaName: logicalOr
  argumentKind: expression
  minArgs: 1
  shorthand: true
'!':
  title: Logical NOT
  summary: Negate the truthiness of one expression.
  schemaName: logicalNot
  argumentKind: expression
  minArgs: 1
  maxArgs: 1
  shorthand: true
'!!':
  title: Boolean conversion
  summary: Use the JSON Logic Boolean conversion form.
  description: One expression is accepted. The syntax does not settle the DSL's conversion
    or truthiness policy.
  schemaName: booleanCast
  argumentKind: expression
  minArgs: 1
  maxArgs: 1
  shorthand: true
