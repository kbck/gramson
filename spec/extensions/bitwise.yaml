'&':
  schemaName: bitwiseAnd
  title: Bitwise AND
  summary: Describe a bitwise AND operation on two expressions.
  argumentKind: expression
  minArgs: 2
  maxArgs: 2
'|':
  schemaName: bitwiseOr
  title: Bitwise OR
  summary: Describe a bitwise OR operation on two expressions.
  argumentKind: expression
  minArgs: 2
  maxArgs: 2
'^':
  schemaName: bitwiseXor
  title: Bitwise XOR
  summary: Describe a bitwise exclusive OR operation on two expressions.
  argumentKind: expression
  minArgs: 2
  maxArgs: 2
'~':
  schemaName: bitwiseNot
  title: Bitwise NOT
  summary: Describe a bitwise complement operation on one expression.
  argumentKind: expression
  minArgs: 1
  maxArgs: 1
  shorthand: true
'<<':
  schemaName: bitwiseLeftShift
  title: Bitwise left shift
  summary: Describe a left shift of an expression by a shift-count expression.
  argumentKind: expression
  minArgs: 2
  maxArgs: 2
'>>':
  schemaName: bitwiseRightShift
  title: Bitwise right shift
  summary: Describe a right shift of an expression by a shift-count expression.
  argumentKind: expression
  minArgs: 2
  maxArgs: 2
hexToInt:
  schemaName: hexToInt
  title: Hexadecimal to integer
  summary: Convert a hexadecimal string expression to an integer.
  description: The intended input has ASCII hexadecimal digits, an optional 0x
    or 0X prefix, and an optional leading minus sign. Whitespace, empty digit
    sequences, and non-string inputs are not intended to be accepted. Validation
    checks expression syntax only; evaluation and operand-type checks are not implemented.
  argumentKind: expression
  minArgs: 1
  maxArgs: 1
  shorthand: true
intToHex:
  schemaName: intToHex
  title: Integer to hexadecimal
  summary: Convert an integer expression to a canonical hexadecimal string.
  description: The intended result uses lowercase digits and a 0x prefix, with
    a leading minus sign for negative integers and no redundant leading zeros.
    Strings, booleans, and floats are not implicitly coerced. Validation checks
    expression syntax only; evaluation and operand-type checks are not implemented.
  argumentKind: expression
  minArgs: 1
  maxArgs: 1
  shorthand: true
